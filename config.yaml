server:
  proxy_addr: ":8080"        # 代理服务监听地址
  admin_addr: ":8081"        # 管理后台监听地址
  read_timeout: 30s          # 读超时（非流式请求）
  write_timeout: 30s         # 写超时（非流式请求）
  idle_timeout: 120s         # 空闲超时
  max_header_bytes: 1048576  # 最大Header大小(1MB)

storage:
  # 可选值: sqlite(默认) / mysql / mem(内存,开发调试用)
  # 注: 达梦/金仓需 Enterprise 编译版
  driver: sqlite
  dsn: "neuralgate.db"
  encrypt_key: "neuralgate-default-encrypt-key"
  max_open_conns: 20
  max_idle_conns: 10
  # ----- MySQL (可选) -----
  # driver: mysql
  # dsn: "root:root@tcp(127.0.0.1:3306)/neuralgate?charset=utf8mb4&parseTime=true"

audit:
  queue_size: 65536          # 环形队列大小
  worker_count: 4            # worker数量
  batch_size: 100            # 批量写入大小
  flush_interval: 5s         # 刷新间隔
  enable_sha256: true        # SHA256存证（Enterprise，需 tamper_proof 授权）
  retention_days: 90         # 日志保留天数（清理任务仅 Enterprise 启动）
  verify_interval: 24h       # 哈希校验间隔（Enterprise）
  verify_batch_size: 1000    # 每次校验批次大小（Enterprise）
  fingerprint_algo: sha256   # 指纹算法：本期仅 sha256；选定后不可更换

rate_limit:
  strategy: token_bucket     # token_bucket/sliding_window
  default_rps: 10            # 默认每秒请求数
  default_tpm: 100000        # 默认每分钟Token数

export:                       # Enterprise only：审计日志外推(audit_stream 门控)
  enabled: false              # 是否启用外推
  type: siem                  # siem/syslog
  endpoint: "https://siem.example.com/api"   # syslog 形如 udp://10.0.0.1:514 或 tcp://...
  api_key: ""                 # SIEM 认证密钥(syslog 忽略)
  batch_size: 50              # 批量大小 1-1000
  flush_interval: 10s         # 拉取/推送节奏 1-60s

license:                      # Enterprise only：缺失/过期/验签失败时软降级为 OSS 模式运行
  file_path: "/etc/neuralgate/license.lic"
  offline_mode: false         # 是否离线授权（当前签发的 license 均为离线授权）

log:
  level: info                 # debug/info/warn/error
  format: json                # json/console
  output: stdout              # stdout/file path

tls:                          # 代理服务 TLS(管理后台 8081 不启用)
  enabled: false
  cert_file: ""
  key_file: ""
  min_version: "1.2"          # 1.2/1.3

ip_filter:                    # IP 黑白名单
  mode: disabled              # disabled/whitelist/blacklist
  whitelist: []               # CIDR 或单 IP,如 ["10.0.0.0/8", "192.168.1.100"]
  blacklist: []
